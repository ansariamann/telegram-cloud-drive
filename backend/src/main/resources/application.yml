server:
  port: 8080

spring:
  application:
    name: telegram-vault-backend
  jackson:
    default-property-inclusion: non_null

# All sensitive config comes from environment variables / .env file
# TELEGRAM_BOT_TOKEN=
# TELEGRAM_CHAT_ID=
# SESSION_SECRET=
# APP_PASSCODE=
# SUPABASE_URL=
# SUPABASE_SERVICE_ROLE_KEY=

logging:
  level:
    com.vault: DEBUG
    org.springframework.web: INFO
