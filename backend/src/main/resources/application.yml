server:
  port: 8080
  # Allow large chunks + multipart overhead
  tomcat:
    max-http-form-post-size: 100MB

spring:
  application:
    name: telegram-vault-backend
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB     # generous limit for chunks/files
      max-request-size: 100MB  # whole request limit

# All sensitive config comes from environment variables / .env file
# TELEGRAM_BOT_TOKEN=
# TELEGRAM_CHAT_ID=
# SESSION_SECRET=
# APP_PASSCODE=
# SUPABASE_URL=
# SUPABASE_SERVICE_ROLE_KEY=

logging:
  level:
    com.vault: DEBUG
    org.springframework.web: INFO
