<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0f1117"/>

  <!-- Vault door outer ring -->
  <circle cx="32" cy="30" r="18" stroke="#4f9cf9" stroke-width="2.5" fill="#1a1f2e"/>

  <!-- Vault door inner ring -->
  <circle cx="32" cy="30" r="12" stroke="#4f9cf9" stroke-width="1.5" fill="#0f1117"/>

  <!-- Vault cross-bar lock (horizontal) -->
  <rect x="20" y="28.5" width="24" height="3" rx="1.5" fill="#4f9cf9"/>
  <!-- Vault cross-bar lock (vertical) -->
  <rect x="30.5" y="18" width="3" height="24" rx="1.5" fill="#4f9cf9"/>

  <!-- Center pin -->
  <circle cx="32" cy="30" r="3" fill="#4f9cf9"/>

  <!-- Handle (small bar off-center right) -->
  <rect x="44" y="27" width="6" height="6" rx="3" fill="#4f9cf9" opacity="0.7"/>
  <rect x="42" y="29.5" width="4" height="1.5" rx="0.75" fill="#4f9cf9" opacity="0.7"/>

  <!-- Telegram paper-plane — bottom right badge -->
  <circle cx="49" cy="49" r="9" fill="#2AABEE"/>
  <path d="M43.5 49.2l3.8 3.5 7.5-7.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- plane arrow -->
  <path d="M43 46l12-3.5-4.5 10.5-2.8-3.5-4.7-3z" fill="white" opacity="0.9"/>
</svg>
